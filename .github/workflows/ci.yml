name: CI

on:
  pull_request:
  push:
    branches: [main, feature/platform-admin]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners default to UTC. tests/unit/projects/default-name.test.ts
# formats 2026-03-29T18:56:42+08:00 with local Date getters and expects
# "03-29 18:56", which only holds in Asia/Shanghai.
env:
  TZ: Asia/Shanghai

jobs:
  quick:
    name: quick (lint / typecheck / guards / local tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test guards
        run: npm run test:guards

      - name: Local tests
        run: npm run test:local

  integration:
    name: integration (MySQL + Redis + MinIO, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: waoowaoo_test
        ports:
          - "3307:3306"
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_EXTERNAL_SERVICES: "1"
      DATABASE_URL: mysql://root:root@127.0.0.1:3307/waoowaoo_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      TZ: Asia/Shanghai
      # Throwaway CI credentials. Defaults match .env.example / src/lib/storage.
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: waoowaoo
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_FORCE_PATH_STYLE: "true"
      MINIO_UPLOAD_TIMEOUT_MS: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # minio/minio's image CMD is only "minio". GitHub service containers cannot
      # pass "server /data", so start server mode with docker run (same release
      # as docker-compose.yml). Port 9000 is the S3 API; 9001 is the console.
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker rm -f ci-minio >/dev/null 2>&1 || true
          docker run -d --name ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="${MINIO_ACCESS_KEY}" \
            -e MINIO_ROOT_PASSWORD="${MINIO_SECRET_KEY}" \
            minio/minio:RELEASE.2025-02-28T09-55-16Z \
            server /data --console-address ":9001"
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "MinIO did not become ready"
            docker logs ci-minio || true
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create MinIO bucket and seed system video
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npx tsx scripts/ci/prepare-minio.ts

      - name: Billing integration
        run: npm run test:billing:integration

      - name: Billing concurrency
        if: ${{ !cancelled() }}
        run: npm run test:billing:concurrency

      - name: API integration
        if: ${{ !cancelled() }}
        run: npm run test:integration:api

      - name: Task integration
        if: ${{ !cancelled() }}
        run: npm run test:integration:task

      - name: System tests
        if: ${{ !cancelled() }}
        run: npm run test:system

      - name: Regression cases
        if: ${{ !cancelled() }}
        run: npm run test:regression:cases
