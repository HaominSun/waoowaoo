name: Prisma migrate deploy

on:
  pull_request:
  push:
    branches:
      - main
      - feature/platform-admin

jobs:
  migrate-empty:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: waoowaoo_migrate_empty
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate an empty database
        run: bash scripts/ci/prisma-migrate-deploy-empty.sh
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/waoowaoo_migrate_empty
