name: Nightly full tests

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 02:00 Beijing
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  test-all:
    name: test:all (MySQL + Redis + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: waoowaoo_test
        ports:
          - "3307:3306"
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # minio/minio is no longer anonymously pullable (Docker Hub denies it;
      # quay.io/minio/minio returns 401). GitHub service containers also cannot
      # pass "server /data". bitnamilegacy/minio starts server mode from its
      # image command and can create the bucket on boot.
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: ci-minio-access
          MINIO_ROOT_PASSWORD: ci-minio-secret
          MINIO_DEFAULT_BUCKETS: waoowaoo
          MINIO_REGION_NAME: us-east-1
        ports:
          - "9000:9000"
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      TEST_EXTERNAL_SERVICES: "1"
      DATABASE_URL: mysql://root:root@127.0.0.1:3307/waoowaoo_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      TZ: Asia/Shanghai
      # Throwaway CI credentials. Defaults match .env.example / src/lib/storage.
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: waoowaoo
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_FORCE_PATH_STYLE: "true"
      MINIO_UPLOAD_TIMEOUT_MS: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create MinIO bucket and seed system video
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npx tsx scripts/ci/prepare-minio.ts

      - name: Full test suite
        run: npm run test:all
